name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-ml-service:
    name: Python ml-service (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mlops_service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            mlops_service/requirements.txt
            mlops_service/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The pinned pretrained text models (~530 MB), cached by their pinned revisions.
      - name: Cache text models
        uses: actions/cache@v4
        with:
          path: ~/.cache/askdeepakai-models
          key: text-models-${{ hashFiles('mlops_service/engine/text_models.py') }}

      - name: Download text models
        run: python -m engine.text_models --download

      - name: Ruff lint
        run: ruff check .

      - name: Pytest
        env:
          ENGINE_SCHEDULER: "0"
        run: pytest tests/ -v

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: ESLint (informational only)
        run: npm run lint:eslint
        continue-on-error: true

      - name: Build
        run: npm run build
